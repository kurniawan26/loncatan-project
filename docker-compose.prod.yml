services:
  app:
    image: kurniawan026/loncatan-project:${IMAGE_TAG:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null && echo ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - loncatan

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: always
    networks:
      - loncatan

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - loncatan

  queue:
    image: kurniawan026/loncatan-project:${IMAGE_TAG:-latest}
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      CONTAINER_ROLE: queue
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - loncatan

networks:
  loncatan:
    driver: bridge

volumes:
  redis_data:
  app_storage:
  app_public:
