services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null && echo ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - loncatan

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - loncatan

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CONTAINER_ROLE: queue
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - loncatan

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - loncatan

  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: builder
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - loncatan

networks:
  loncatan:
    driver: bridge

volumes:
  redis_data:
  node_modules:
